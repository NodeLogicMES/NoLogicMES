<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title data-i18n="page_title">NoLogic MES</title>
        <link rel="stylesheet" href="/static/css/paleta.css">
        <style>
            
            .lang-selector {
                text-align: right;
                padding: 10px;
            }
            
            .lang-selector button {
                width: 2vw;
                aspect-ratio: 1 / 1;
                margin: 0.15vw;
                font-size: max(1vw, 10px);
                min-width: 25px
            }
            .columnas_2 {
                display: flex;
                justify-content: space-evenly;
                align-items: center;
                width: 100%;
                margin-top: 40px;
            }

            .columnas_2 a {
                width: 20vw;
                aspect-ratio: 1 / 1;
                display: flex;
                justify-content: center;
                align-items: center;
                text-align: center;
                background-color: var(--bg-superficies);
                border: 2px solid var(--border-color);
                border-radius: 1vw;
                text-decoration: none;
                font-weight: bold;
                transition: transform 0.15s ease, border-color 0.15s ease;
                font-size: 3.2vw; 
            }

            .columnas_2 a:hover {
                background-color: var(--bg-hover);
                border-color: var(--resaltado-hover);
                transform: translateY(-4px);
            }
        </style>
        <script src="/static/js/i18n.js"></script>
    </head>
    <body>
        <!-- Selector sencillo de idioma -->
        <div class="lang-selector">
            <button onclick="cambiarIdioma('es')">ES</button>
            <button onclick="cambiarIdioma('en')">EN</button>
            <button onclick="cambiarIdioma('ca')">CA</button>
        </div>

        <h1 data-i18n="welcome_title">Bienvenido a NoLogic MES</h1>
        
        <p class="columnas_2">
            <a href="/fabrica" data-i18n="btn_factory">FÁBRICA</a>
            <a href="/oficina" data-i18n="btn_office">OFICINA</a>
        </p>

    </body>
</html>
