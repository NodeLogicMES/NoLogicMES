<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title data-i18n="page_title">NoLogic MES</title>
        <link rel="stylesheet" href="/static/css/palette.css">
        <style>
            
            .lang-selector {
                text-align: right;
                padding: 10px;
            }
            
            .lang-selector button {
                width: 2vw;
                aspect-ratio: 1 / 1;
                margin: 0.15vw;
                font-size: max(1vw, 10px);
                min-width: 25px
            }
            .columns_2 {
                display: flex;
                justify-content: space-evenly;
                align-items: center;
                width: 100%;
                margin-top: 40px;
            }

            .columns_2 a {
                width: 20%;
                aspect-ratio: 1 / 1;
                display: flex;
                justify-content: center;
                align-items: center;
                background-color: var(--bg-surface);
                border: 2px solid var(--border-color);
                border-radius: 1vw;
                text-decoration: none;
                font-weight: bold;
                transition: transform 0.15s ease, border-color 0.15s ease;
                /*font-size: 3.2vw;*/ 
            }

            .columns_2 a:hover {
                background-color: var(--bg-hover);
                border-color: var(--accent-hover);
                transform: translateY(-4px);
            }

            .adjusted-text {
                width: 80%;
                height: auto;
                overflow: visible;
            }

            .adjusted-text text {
                fill: var(--text-primary);
                font-weight: bold;
            }
            </style>
            <script src="/static/js/i18n.js" >
                
            </script>
    </head>
    <body>
        <div class="lang-selector">
            <button onclick="changeLang('es')">ES</button>
            <button onclick="changeLang('ca')">CA</button>
            <button onclick="changeLang('en')">EN</button>
        </div>

        <h1 data-i18n="welcome_title">Welcome to NoLogic MES</h1>
        
        <p class="columns_2">
            <a href="/factory">
                <svg viewBox="0 0 110 24" class="adjusted-text">
                    <text x="50%" y="50%" dominant-baseline="central" text-anchor="middle" data-i18n="btn_factory">FACTORY</text>
                </svg>
            </a>
            <a href="/office">
                <svg viewBox="0 0 110 24" class="adjusted-text">
                    <text x="50%" y="50%" dominant-baseline="central" text-anchor="middle" data-i18n="btn_office">OFFICE</text>
                </svg>
            </a>
        </p>

    </body>
</html>
